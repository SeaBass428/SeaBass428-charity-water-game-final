<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Charity Water Game | Pipe Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="game">
        <div class="celebration" id="celebration" aria-hidden="true"></div>
        <header class="banner">
            <p>PIPE FEED</p>
            <h1><img class="title-icon" src="img/water-can-transparent.png" alt="" aria-hidden="true">charity:water</h1>
        </header>
        <section class="game-layout" aria-label="Pipe Feed game">
            <aside class="info-panel">
                <section class="hud" aria-label="Game status">
                    <div class="tag" id="level">Level 1</div>
                    <div class="tag" id="score">Score: 0</div>
                    <div class="tag" id="timer" aria-live="off">01:00</div>
                </section>
                <p class="message" id="message" aria-live="polite">Rotate the pipes to guide the water to the drain.</p>
                <section class="win-message" id="win-message" aria-live="polite" hidden>
                    <h2>You win!</h2>
                    <p id="round-score"></p>
                    <p>Continue to the next level?</p>
                    <button class="btn" id="continue" type="button">Continue</button>
                </section>
            </aside>
            <div class="board-wrap">
                <div class="source" aria-hidden="true">
                    <div class="terminal">
                        <svg viewBox="0 0 100 100">
                            <path class="body" d="M0 27H94V73H0Z"/>
                            <ellipse class="rim-outer" cx="94" cy="50" rx="6" ry="23"/>
                            <ellipse class="opening" cx="94" cy="50" rx="3" ry="15"/>
                        </svg>
                    </div>
                </div>
                <div id="board" class="board" role="group" aria-label="Pipe puzzle board"></div>
                <div class="goal" aria-hidden="true">
                    <div class="terminal">
                        <svg viewBox="0 0 100 100">
                            <path class="body" d="M27 0H73V100H27Z"/>
                            <ellipse class="rim-outer" cx="50" cy="6" rx="23" ry="6"/>
                            <ellipse class="opening" cx="50" cy="6" rx="15" ry="3"/>
                        </svg>
                    </div>
                </div>
            </div>
            <aside class="controls-panel">
                <div class="mode-selector">
                    <label for="game-mode">Game mode</label>
                    <select class="form-select" id="game-mode" aria-describedby="mode-description">
                        <option value="normal">Normal</option>
                        <option value="hard">Hard</option>
                    </select>
                    <p id="mode-description">More time to solve each puzzle.</p>
                </div>
                <div class="controls" aria-label="Game controls">
                    <button class="btn" id="restart" type="button">Restart</button>
                    <button class="btn" id="pause" type="button" aria-pressed="false">Pause</button>
                    <button class="btn" id="flow" type="button">Start Water</button>
                </div>
                <section class="music-player card" aria-label="Music player">
                    <div class="card-body">
                        <p class="music-label">GAME SOUNDTRACK</p>
                        <h2 class="music-track-name" id="music-track-name">Jump into Water by Alex Zavesa</h2>
                        <section class="music-library" aria-labelledby="music-library-heading">
                            <h3 class="music-label" id="music-library-heading">Music used on this website</h3>
                            <ol class="music-track-list" id="music-track-list"></ol>
                        </section>
                        <label class="visually-hidden" for="music-progress">Song progress</label>
                        <input class="music-progress" id="music-progress" type="range" min="0" max="0" value="0" step="0.1" disabled>
                        <div class="music-time" aria-live="off">
                            <span id="music-current-time">0:00</span>
                            <span>/ <span id="music-duration">--:--</span></span>
                        </div>
                        <div class="music-actions">
                            <button class="btn btn-outline-secondary music-button" id="music-back" type="button" aria-label="Skip back 10 seconds" disabled>
                                <i class="bi bi-skip-backward-fill" aria-hidden="true"></i>
                            </button>
                            <button class="btn btn-primary music-button" id="music-play" type="button" aria-label="Play background music">
                                <i class="bi bi-play-fill" id="music-play-icon" aria-hidden="true"></i>
                                <span id="music-play-text">Play</span>
                            </button>
                            <button class="btn btn-outline-secondary music-button" id="music-forward" type="button" aria-label="Skip forward 10 seconds" disabled>
                                <i class="bi bi-skip-forward-fill" aria-hidden="true"></i>
                            </button>
                        </div>
                        <button class="btn btn-outline-secondary music-button music-mute" id="music-mute" type="button" aria-label="Mute background music" aria-pressed="false">
                            <i class="bi bi-volume-up-fill" id="music-mute-icon" aria-hidden="true"></i>
                            <span>Mute</span>
                        </button>
                        <audio id="background-music" loop preload="metadata">
                            <source src="audio/alexzavesa-jump-into-water.mp3" type="audio/mpeg">
                        </audio>
                        <p class="visually-hidden" id="music-status" aria-live="polite">Background music is off.</p>
                    </div>
                </section>
            </aside>
        </section>
    </main>
</body>
</html>
